name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  PYTHON_VERSION: "3.10"
  POETRY_VERSION: "2.3.4"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. LINT — ruff check + format (no Poetry install needed, fast)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Check lint rules (E, F, W, I, UP)
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD — validate pyproject.toml + install deps
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Validate pyproject.toml
        run: poetry check

      - name: Configure in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. TEST + COVERAGE — 100% branch coverage enforced; artifacts uploaded
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Configure in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Restore virtualenv cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install

      - name: Run tests with branch coverage (100% required)
        run: |
          poetry run pytest \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage XML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. SMOKE TEST — verifies the installed CLI prints the exact greeting
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Configure in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Restore virtualenv cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install

      - name: Smoke test — CLI greeting
        run: |
          actual=$(poetry run sakura hello)
          expected="Hello from Sakura-II: Titan Biosignature Engine Active"
          if [ "$actual" = "$expected" ]; then
            echo "PASS: $actual"
          else
            echo "FAIL"
            printf "Expected: %s\n" "$expected"
            printf "Actual:   %s\n" "$actual"
            exit 1
          fi
