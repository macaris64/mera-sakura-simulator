[tool.poetry]
name = "mera-sakura-simulator"
version = "0.1.0"
description = "Hello World simulator for the EdgeCortix SAKURA-II NPU using the MERA framework"
authors = ["Mehmet Acar <mehmetacar683@gmail.com>"]
readme = "README.md"
packages = [{include = "sakura_simulator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = {version = ">=0.25.1", extras = ["all"]}
mera = {version = ">=1.6.0.post1", extras = ["full"]}
pydantic = "^2.13.3"
pyyaml = "^6.0.3"
httpx = "^0.28.1"
numpy = ">=1.23,<2"
onnx = ">=1.14,<1.17"
transformers = {version = ">=4.30,<4.41", optional = true}

[tool.poetry.extras]
llm = ["transformers"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.15.12"
optimum = {extras = ["exporters"], version = "^2.1.0"}

[tool.poetry.scripts]
sakura = "sakura_simulator.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests/test_engine.py",
    "tests/test_cli.py",
    "tests/test_registry.py",
    "tests/test_smoke.py",
    "tests/test_compiler.py",
    "tests/test_runtime.py",
    "tests/test_tokenizer.py",
    "tests/test_infer.py",
]
addopts = [
    "--cov=sakura_simulator",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "-v",
]

[tool.coverage.run]
source = ["sakura_simulator"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = [
    "src/sakura_simulator",
    "*/site-packages/sakura_simulator",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
